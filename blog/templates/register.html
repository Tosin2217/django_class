<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Form</title>
    <!-- FontAwesome for Input Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Reset and Core Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Login Card Container */
        .login-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        /* Typography */
        .login-form h2 {
            color: #333333;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .login-form .subtitle {
            color: #777777;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Input Fields */
        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Form Actions / Extra Links */
        .form-utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .forgot-pass, .register-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-pass:hover, .register-text a:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #556ee6;
        }

        /* Registration Prompt */
        .register-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <form method="POST" class="login-form">
             {% csrf_token%}
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in</p>

            <!-- Username/Email Field -->
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" name="username" placeholder="username" required>
            </div>
  <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="email" required>
            </div>
            <!-- Password Field -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password1" placeholder="Password" required>
            </div>
                <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password2" placeholder="Confirm Password" required>
            </div>

            <!-- Utilities (Remember Me & Forgot Password) -->
            <div class="form-utils">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn">Sign In</button>

            <!-- Register Link -->
            <p class="register-text">Don't have an account? <a href="#">Sign up</a></p>
        </form>
        {{form.errors}}
    </div>

</body>
</html>
